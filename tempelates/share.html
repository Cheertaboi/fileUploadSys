<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Shared</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h2>File Shared Successfully</h2>
        <p>Your file can be accessed via the following link:</p>
        <a href="{{ .TinyURL }}" target="_blank">{{ .TinyURL }}</a>
        <div class="links">
            <a class="button-link" href="/files">Back to Files</a>
        </div>
    </div>
    {{ if .showLogout }}
  <form method="POST" action="/logout">
    <button type="submit">Logout</button>
  </form>
{{ end }}
</body>
</html>
